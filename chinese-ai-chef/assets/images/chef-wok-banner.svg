<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="wokGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1C1C"/>
      <stop offset="100%" stop-color="#5A0E0E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <g transform="translate(100, 70)">
    <!-- Steam -->
    <path d="M70,30 Q60,10 70,-10" stroke="#D97706" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M100,20 Q90,0 100,-20" stroke="#D97706" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M130,30 Q120,10 130,-10" stroke="#D97706" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Wok Body -->
    <path d="M30,80 C30,140 80,180 100,180 C120,180 170,140 170,80 Z" fill="url(#wokGrad)"/>
    <!-- Rim -->
    <ellipse cx="100" cy="80" rx="72" ry="12" fill="#771515"/>
    <!-- Handles -->
    <path d="M24,76 L10,72 A6,6 0 0,0 4,84 L18,88 Z" fill="#382F2F"/>
    <path d="M176,76 L190,72 A6,6 0 0,1 196,84 L182,88 Z" fill="#382F2F"/>
    <!-- Flame base -->
    <path d="M80,180 Q100,205 120,180 Q110,195 100,185 Q90,195 80,180 Z" fill="#D97706"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="'Noto Serif SC', Georgia, serif" font-size="16" font-weight="bold" fill="#9B1C1C" letter-spacing="3">中华AI主厨 · 鲜香美味</text>
</svg>
